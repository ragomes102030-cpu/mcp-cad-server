[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cad-server"
version = "0.2.3"
description = "Servidor MCP para AutoCAD: desenha plantas, lê desenhos e calcula quantitativos"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14,<3",
    "mcp",
    "ezdxf",
    "shapely",
    "matplotlib",
    "pillow",
    "structlog",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
cad-mcp = "cad_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cad_mcp*", "autocad_mcp*"]
