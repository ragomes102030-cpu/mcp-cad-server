[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cad-cloud"
version = "0.2.2"
description = "Authenticated, verified headless CAD MCP for DXF drawing"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14,<5",
    "ezdxf>=1.4,<2",
]

[project.scripts]
mcp-cad-cloud = "mcp_cad_cloud.server:main"

[tool.setuptools]
packages = ["mcp_cad_cloud"]
