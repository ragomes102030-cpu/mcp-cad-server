name: MCP CAD multifamiliar A3 export
on:
  push:
    branches: [feat/multifamiliar-four-units-model]
    paths:
      - 'cloud/ezdxf/mcp_cad_cloud/multifamiliar_*.py'
      - 'cloud/ezdxf/tests/test_multifamiliar_*.py'
      - '.github/workflows/multifamiliar-a3.yml'
  workflow_dispatch:

jobs:
  export-a3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud/ezdxf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD engine and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate real DXF-backed A3 export
        run: python -m pytest -q tests/test_multifamiliar_pilot.py tests/test_multifamiliar_detail.py tests/test_multifamiliar_partition.py tests/test_multifamiliar_export.py
      - name: Produce DXF and PDF from MCP CAD module
        run: |
          python - <<'PY'
          from mcp_cad_cloud.multifamiliar_export import generate_multifamily_preview
          from pathlib import Path
          result = generate_multifamily_preview('artifacts')
          for key in ('dxf','pdf'):
              p = Path(result[key])
              assert p.is_file() and p.stat().st_size > 1000
              print(f'{key}: {p} ({p.stat().st_size} bytes)')
          PY
      - name: Upload real CAD outputs
        uses: actions/upload-artifact@v4
        with:
          name: multifamiliar-preliminar-a3-dxf
          path: |
            cloud/ezdxf/artifacts/multifamiliar_preliminar_A3.pdf
            cloud/ezdxf/artifacts/multifamiliar_preliminar.dxf
          if-no-files-found: error
          retention-days: 30
