name: MCP CAD Cloud — regressões
on:
  push:
    branches:
      - cloud/ezdxf
      - 'feat/cloud-programa-*'
  pull_request:
    branches:
      - cloud/ezdxf
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cloud MCP and pytest
        run: python -m pip install -e ./cloud/ezdxf pytest matplotlib
      - name: Run cloud geometry, interface and DXF regressions
        env:
          PYTHONPATH: cloud/ezdxf
          MCP_CAD_PROFILE: full
        run: python -m pytest cloud/ezdxf/tests -q
      - name: Run independent engineering quantity benchmark
        env:
          PYTHONPATH: cloud/ezdxf
          MCP_CAD_PROFILE: full
        run: python tools/run_cad_engineering_benchmark.py --output out/cad-engineering-benchmark.json
      - name: Upload engineering benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arquimedes-cad-engineering-benchmark
          path: out/cad-engineering-benchmark.json
          retention-days: 30
      - name: Run plant generation lab
        env:
          PYTHONPATH: cloud/ezdxf
          MCP_CAD_PROFILE: full
        run: python tools/run_plant_lab.py --output out/plant-lab
      - name: Run architectural licensing package corpus
        env:
          PYTHONPATH: cloud/ezdxf
          MCP_CAD_PROFILE: full
        run: python tools/run_licensing_corpus.py --output out/licensing-corpus
      - name: Upload licensing package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residential-licensing-corpus
          path: out/licensing-corpus/
          retention-days: 30
      - name: Upload plant lab reports and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-generation-lab
          path: out/plant-lab/
          retention-days: 30
      - name: Generate review previews and DXF
        env:
          PYTHONPATH: cloud/ezdxf
          MCP_CAD_PROFILE: full
        run: python tools/render_cloud_previews.py
      - name: Upload review previews
        uses: actions/upload-artifact@v4
        with:
          name: plantas-previas-pr1
          path: out/preview-cad/
          retention-days: 30
