# Render deploy config — mcp-cad-cloud (Docker)
#
# Build via Dockerfile (multi-stage, python:3.12-slim)
# Start: python -m mcp_cad_cloud.server

services:
  - type: docker
    dockerfilePath: Dockerfile
    name: mcp-cad-cloud
    env: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: python -m mcp_cad_cloud.server
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: CAD_BACKEND
        value: ezdxf
      - key: CAD_TEMP
        value: /tmp/mcp_cad
