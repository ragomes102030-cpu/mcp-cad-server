# Render deploy config — mcp-cad-cloud (ezdxf headless, sem AutoCAD)

services:
  - type: web
    name: mcp-cad-cloud
    runtime: python
    plan: starter
    buildCommand: pip install -e ./cloud/ezdxf
    startCommand: python -m mcp_cad_cloud.server
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: CAD_BACKEND
        value: ezdxf
      - key: CAD_TEMP
        value: /tmp/mcp_cad
